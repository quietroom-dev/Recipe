<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>レシピアプリ</title>
<style>
:root{--primary:#007aff;--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:600px;margin:auto;padding:16px 16px 110px}.hidden{display:none!important}
input,textarea,select{font:inherit}.form{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px}
#search{width:100%;padding:12px 40px 12px 16px;border:0;border-radius:14px;font-size:16px;box-shadow:0 2px 8px #0000000d}
.search{position:relative;margin-bottom:12px}.clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;width:20px;height:20px;border-radius:50%;background:#ccc;color:#fff;align-items:center;justify-content:center}
.filters{display:flex;gap:8px;background:#fff;padding:8px;border-radius:14px;margin-bottom:20px}.filter{flex:1;border:0;border-radius:10px;background:none;padding:8px;font-weight:bold;color:var(--sub)}.filter.active{background:var(--primary);color:#fff}.sort{border:0;background:#f2f2f7;border-radius:8px;color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #00000014;position:relative}.card img,.noimg{width:100%;height:100px;object-fit:cover}.noimg{display:flex;align-items:center;justify-content:center;background:#e5e5ea;color:#999}.info{padding:8px;height:50px;position:relative}.title{font-size:13px;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sub{position:absolute;bottom:4px;right:8px;font-size:10px;color:var(--sub)}
.star{position:absolute;right:6px;top:6px;z-index:2;font-size:20px;color:#aaa;text-shadow:1px 1px #000;cursor:pointer}.star.on{color:#fc0}
.group{grid-column:1/-1;background:#e5e5ea;border-radius:12px;margin:16px 0 8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.moves button{width:32px;height:32px;min-height:32px;padding:0;border:0;border-radius:50%}
.ingredient{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px}.step{display:flex;gap:12px;background:#fff;padding:12px;border-radius:12px;margin-bottom:8px}.step.done{opacity:.4;text-decoration:line-through}
button{min-height:44px;padding:10px 14px;border:0;border-radius:10px;font-family:inherit;touch-action:manipulation}.main{width:100%;background:var(--primary);color:#fff;font-size:16px;font-weight:bold;margin-top:10px}.danger{background:#ff3b30;color:#fff}.outline{width:100%;background:#fff;border:1px solid var(--primary);color:var(--primary)}
.tabs{position:fixed;bottom:0;left:0;width:100%;height:90px;padding-bottom:env(safe-area-inset-bottom);display:flex;background:#fffffff0;backdrop-filter:blur(10px);border-top:1px solid #d1d1d6;z-index:10}.tabs button{flex:1;background:none;color:var(--sub);font-size:10px}.tabs button.active{color:var(--primary)}.ico{font-size:20px;display:block}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:24px;background:#000c;color:#fff;opacity:0;transition:.25s;z-index:99}#toast.show{opacity:1}
</style>
</head>
<body>
<div class="container">
<section id="listPage"><div style="font-size:10px;color:var(--sub);text-align:right">v2.00 IndexedDB</div>
<div class="search"><input id="search" placeholder="材料や料理名で検索..."><span id="clear" class="clear">×</span></div>
<div class="filters"><button id="all" class="filter active">すべて</button><button id="fav" class="filter">お気に入り</button><select id="sort" class="sort"><option value="reg">登録順</option><option value="count">調理回数</option><option value="date">最終調理日</option></select></div>
<div id="list" class="grid"></div></section>
<section id="detailPage" class="hidden"></section>
<section id="addPage" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 id="formTitle">レシピ登録</h2><button id="clearForm" style="background:none;color:var(--primary)">クリア</button></div>
<input id="title" class="form" placeholder="タイトル"><input id="groupName" class="form" placeholder="カテゴリー（主菜、お菓子など）"><input id="source" class="form" placeholder="参照URL">
<div>写真：<input id="image" type="file" accept="image/*"></div>
<div id="imageBox" class="hidden"><img id="preview" style="width:120px;height:120px;object-fit:cover;border-radius:12px;margin-top:10px"><br><button id="removeImage" style="color:#ff3b30;background:none">画像を削除</button></div>
<h3>材料</h3><div id="ingredients"></div><button id="addGroup" class="outline">グループを追加</button>
<h3>作り方</h3><div id="steps"></div><button id="addStep" class="outline">工程を追加</button><button id="save" class="main">レシピを保存</button>
<button id="cancel" style="width:100%;background:none;color:var(--sub)">キャンセル</button>
</section>
<section id="shoppingPage" class="hidden"><h2>買い物リスト</h2><div style="display:flex;gap:8px"><input id="manual" class="form" style="flex:2" placeholder="品名"><input id="amount" class="form" style="flex:1" placeholder="分量"><button id="addManual" style="background:var(--primary);color:#fff">追加</button></div><ul id="shop" style="padding:0"></ul><button id="clearShop" style="width:100%;background:#eee;color:#ff3b30">リストを空にする</button></section>
<section id="stockPage" class="hidden"><h2>在庫リスト</h2><div style="display:flex;gap:8px"><input id="stockInput" class="form" placeholder="在庫アイテム"><button id="addStock" style="background:var(--primary);color:#fff">追加</button></div><ul id="stock" style="padding:0"></ul>
<div class="backup-panel">
  <div class="backup-actions">
    <button type="button" class="backup-btn" onclick="backupWithImages()">バックアップ</button>
    <label class="backup-btn">復元
      <input id="importZip" type="file" accept=".zip,application/zip" hidden
        onchange="if(this.files[0])restoreWithImages(this.files[0])">
    </label>
  </div>
</div></section>
</div>
<nav class="tabs"><button id="tab-list" class="active"><span class="ico">📖</span>一覧</button><button id="tab-add"><span class="ico">➕</span>登録</button><button id="tab-shopping"><span class="ico">🛒</span>買い物</button><button id="tab-stock"><span class="ico">📦</span>在庫</button></nav><div id="toast"></div>
<script>
const DB="RecipeAppDB",V=2,S={recipes:"recipes",shopping:"shopping",stock:"stock",settings:"settings"};let db,recipes=[],shopping=[],stock=[],groups=[],editId=null,pending=null,removeImg=false,filter="all",page="list",open={};
const $=x=>document.getElementById(x),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const kata=x=>String(x||"").replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
const request=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});const store=(n,m="readonly")=>db.transaction(n,m).objectStore(n);
function openDB(){return new Promise((a,b)=>{let r=indexedDB.open(DB,V);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains(S.recipes)){let x=d.createObjectStore(S.recipes,{keyPath:"id"});x.createIndex("createdAt","createdAt")}if(!d.objectStoreNames.contains(S.shopping))d.createObjectStore(S.shopping,{keyPath:"id"});if(!d.objectStoreNames.contains(S.stock))d.createObjectStore(S.stock,{keyPath:"id"});if(!d.objectStoreNames.contains(S.settings))d.createObjectStore(S.settings,{keyPath:"key"})};r.onsuccess=()=>{db=r.result;a()};r.onerror=()=>b(r.error)})}
const all=n=>request(store(n).getAll()),put=(n,x)=>request(store(n,"readwrite").put(x)),del=(n,x)=>request(store(n,"readwrite").delete(x)),clear=n=>request(store(n,"readwrite").clear());
function toast(x){let t=$("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
async function load(){recipes=await all(S.recipes);shopping=await all(S.shopping);stock=await all(S.stock);let g=await request(store(S.settings).get("main"));groups=g?.groups||[];recipes.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));let changed=false;recipes.forEach(r=>{let g=r.group||"未分類";if(!groups.includes(g)){groups.push(g);changed=true}});if(changed)await put(S.settings,{key:"main",groups});renderList();renderShopping();renderStock()}
function show(p){page=p;["list","detail","add","shopping","stock"].forEach(x=>$(x+"Page").classList.add("hidden"));$(p+"Page").classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));$("tab-"+p)?.classList.add("active");if(p=="list")renderList();if(p=="shopping")renderShopping();if(p=="stock")renderStock();scrollTo(0,0)}
function renderList(){let box=$("list");box.innerHTML="";let k=kata($("search").value.toLowerCase()),type=$("sort").value,G={};recipes.forEach(r=>{let hit=kata((r.title||"").toLowerCase()).includes(k)||(r.ingredients||[]).some(g=>(g.items||[]).some(x=>kata((x.name||"").toLowerCase()).includes(k)));if(hit&&(filter=="all"||r.favorite)){let g=r.group||"未分類";(G[g]??=[]).push(r)}});groups.forEach(g=>{if(!G[g])return;if(open[g]===undefined)open[g]=false;let ex=k||open[g],h=document.createElement("div");h.className="group";h.innerHTML=`<b>${esc(g)} <small>${ex?"▼":"▶"}</small></b><span class=moves><button>↑</button><button>↓</button></span>`;h.querySelector("b").onclick=()=>{open[g]=!open[g];renderList()};h.querySelectorAll("button")[0].onclick=()=>moveGroup(g,-1);h.querySelectorAll("button")[1].onclick=()=>moveGroup(g,1);box.appendChild(h);if(!ex)return;let a=[...G[g]];if(type=="count")a.sort((x,y)=>(y.cookCount||0)-(x.cookCount||0));if(type=="date")a.sort((x,y)=>new Date(y.lastCookedDate||0)-new Date(x.lastCookedDate||0));a.forEach(r=>{let c=document.createElement("div");c.className="card";let u=r.imageBlob?URL.createObjectURL(r.imageBlob):"";c.innerHTML=`<div class="star ${r.favorite?"on":""}">★</div>${u?`<img src="${u}">`:`<div class=noimg>No Image</div>`}<div class=info><div class=title>${esc(r.title)}</div><div class=sub>${type=="date"?esc(r.lastCookedDate||"未"):"×"+(r.cookCount||0)}</div></div>`;c.querySelector(".star").onclick=e=>{e.stopPropagation();fav(r.id)};c.onclick=()=>detail(r.id);box.appendChild(c);if(u)c.querySelector("img").onload=()=>URL.revokeObjectURL(u)})})}
async function moveGroup(g,d){let i=groups.indexOf(g),j=i+d;if(j<0||j>=groups.length)return;[groups[i],groups[j]]=[groups[j],groups[i]];await put(S.settings,{key:"main",groups});renderList()}
async function fav(i){let r=recipes.find(x=>x.id==i);r.favorite=!r.favorite;r.updatedAt=Date.now();await put(S.recipes,r);renderList()}
function detail(i){let r=recipes.find(x=>x.id==i);show("detail");let d=$("detailPage");d.innerHTML=`<h1>${esc(r.title)}</h1><div style="display:flex;gap:10px"><button id=cook class=main style="flex:2;background:#34c759;margin:0">🍳 今日作った</button><button id=dfav class=main style="flex:1;background:${r.favorite?"#fc0":"#eee"};color:${r.favorite?"#fff":"#888"}>★</button></div>`;if(r.imageBlob){let im=document.createElement("img");im.className="detail-img";im.style="width:100%;border-radius:16px;margin-top:16px";im.src=URL.createObjectURL(r.imageBlob);d.appendChild(im)}if(r.sourceUrl){let a=document.createElement("a");a.href=r.sourceUrl;a.target="_blank";a.rel="noopener";a.textContent="レシピ元を開く";a.style="display:block;text-align:center;margin:15px";d.appendChild(a)}let h=document.createElement("h3");h.textContent="材料";d.appendChild(h);(r.ingredients||[]).forEach((g,gi)=>{let b=document.createElement("div");b.className="ingredient";b.innerHTML=`<b>${esc(g.name)}</b> <button style="float:right;background:var(--primary);color:#fff;font-size:11px">この組を追加</button>`;b.querySelector("button").onclick=()=>addGroupShop(g);g.items.forEach(x=>{let l=document.createElement("label");l.style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #f2f2f7";l.innerHTML=`<input type=checkbox><span>${esc(x.name)}</span><span style="margin-left:auto;color:var(--sub)">${esc(x.amount)}</span>`;l.querySelector("input").dataset.name=x.name;l.querySelector("input").dataset.amount=x.amount;b.appendChild(l)});d.appendChild(b)});let sb=document.createElement("button");sb.className="outline";sb.textContent="選択した材料を買い物リストへ";sb.onclick=async()=>{for(let c of d.querySelectorAll(".ingredient input:checked"))await put(S.shopping,{id:id(),name:c.dataset.name,amount:c.dataset.amount,checked:false});shopping=await all(S.shopping);toast("追加しました")};d.appendChild(sb);let sh=document.createElement("h3");sh.textContent="作り方";d.appendChild(sh);(r.steps||[]).forEach((s,n)=>{let x=document.createElement("div");x.className="step";x.innerHTML=`<b>${n+1}</b><span>${esc(String(s).replace(/^\d+\.\s*/,""))}</span>`;x.onclick=()=>x.classList.toggle("done");d.appendChild(x)});let f=document.createElement("div");f.style="display:flex;gap:10px;margin-top:30px";f.innerHTML="<button class=outline>編集</button><button class='danger' style='flex:1'>削除</button>";f.children[0].onclick=()=>edit(i);f.children[1].onclick=()=>delRecipe(i);d.appendChild(f);$("cook").onclick=()=>cook(i);$("dfav").onclick=async()=>{await fav(i);detail(i)}}
async function addGroupShop(g){for(let x of g.items)await put(S.shopping,{id:id(),name:x.name,amount:x.amount,checked:false});shopping=await all(S.shopping);toast("グループを追加しました")}
async function cook(i){let r=recipes.find(x=>x.id==i),d=new Date();r.cookCount=(r.cookCount||0)+1;r.lastCookedDate=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;await put(S.recipes,r);detail(i);toast("調理を記録しました！")}
async function delRecipe(i){if(!confirm("消去しますか？"))return;await del(S.recipes,i);recipes=recipes.filter(x=>x.id!=i);show("list");toast("削除しました")}
function reset(){editId=null;pending=null;removeImg=false;$("title").value=$("groupName").value=$("source").value="";$("image").value="";$("imageBox").classList.add("hidden");$("ingredients").innerHTML=$("steps").innerHTML="";$("formTitle").textContent="レシピ登録";addGroup();addStep()}
function addGroup(){let b=document.createElement("div");b.style="background:#fff;padding:10px;border-radius:10px;margin:10px 0";b.innerHTML=`<div style="display:flex;gap:5px"><input class=grp style="flex:1;padding:8px;border:1px solid #ddd;border-radius:5px" placeholder="グループ名"><button>×</button></div><div class=items></div><button class=add style="background:none;color:var(--primary)">+ 材料を追加</button>`;$("ingredients").appendChild(b);addItem(b.querySelector(".items"));b.querySelector("button").onclick=()=>b.remove();b.querySelector(".add").onclick=()=>addItem(b.querySelector(".items"))}
function addItem(t){let r=document.createElement("div");r.style="display:flex;gap:5px;margin:7px 0";r.innerHTML=`<input style="flex:2;padding:8px;border:1px solid #ddd;border-radius:5px" placeholder="品名"><input style="flex:1;padding:8px;border:1px solid #ddd;border-radius:5px" placeholder="分量"><button style="color:#c00">×</button>`;t.appendChild(r);r.querySelector("button").onclick=()=>r.remove()}
function addStep(){let r=document.createElement("div");r.style="display:flex;gap:7px;margin:7px 0";r.innerHTML=`<b class=sn></b><textarea style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;height:60px" placeholder="手順を入力"></textarea><button style="color:#c00">×</button>`;$("steps").appendChild(r);r.querySelector("button").onclick=()=>{r.remove();numbers()};numbers()}
function numbers(){$("steps").querySelectorAll(".sn").forEach((x,i)=>x.textContent=i+1)}
function edit(i){let r=recipes.find(x=>x.id==i);editId=i;removeImg=false;pending=null;show("add");$("formTitle").textContent="レシピ編集";$("title").value=r.title;$("groupName").value=r.group||"";$("source").value=r.sourceUrl||"";$("ingredients").innerHTML="";(r.ingredients||[]).forEach(g=>{addGroup();let b=$("ingredients").lastElementChild;b.querySelector(".grp").value=g.name;b.querySelector(".items").innerHTML="";g.items.forEach(x=>{addItem(b.querySelector(".items"));let q=b.querySelector(".items").lastElementChild.querySelectorAll("input");q[0].value=x.name;q[1].value=x.amount})});$("steps").innerHTML="";(r.steps||[]).forEach(s=>{addStep();$("steps").lastElementChild.querySelector("textarea").value=String(s).replace(/^\d+\.\s*/,"")});if(r.imageBlob){$("imageBox").classList.remove("hidden");$("preview").src=URL.createObjectURL(r.imageBlob)}}
async function compress(file){return new Promise((ok,no)=>{let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{let m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),"image/jpeg",.78)};im.src=rd.result};rd.readAsDataURL(file)})}
async function saveRecipe(){let t=$("title").value.trim();if(!t)return toast("タイトルを入力してください");let ing=[];$("ingredients").querySelectorAll(":scope>.group").forEach(()=>{});document.querySelectorAll("#ingredients>div").forEach(b=>{let items=[];b.querySelectorAll(".items>div").forEach(r=>{let q=r.querySelectorAll("input");if(q[0].value.trim())items.push({name:q[0].value.trim(),amount:q[1].value.trim()})});if(items.length)ing.push({name:b.querySelector(".grp").value.trim()||"材料",items})});let steps=[...document.querySelectorAll("#steps textarea")].map(x=>x.value.trim()).filter(Boolean),old=editId?recipes.find(x=>x.id==editId):null,img=old?.imageBlob||null;if(removeImg)img=null;if(pending)img=await compress(pending);let r={id:editId||id(),title:t,group:$("groupName").value.trim()||"未分類",sourceUrl:$("source").value.trim(),imageBlob:img,ingredients:ing,steps,favorite:old?.favorite||false,cookCount:old?.cookCount||0,lastCookedDate:old?.lastCookedDate||null,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};await put(S.recipes,r);recipes=await all(S.recipes);let g=r.group;if(!groups.includes(g)){groups.push(g);await put(S.settings,{key:"main",groups})}reset();show("list");toast("保存しました");if(confirm("バックアップを取りますか？"))await backupWithImages()}
function renderShopping(){$("shop").innerHTML="";shopping.sort((a,b)=>+a.checked-+b.checked).forEach(x=>{let li=document.createElement("li");li.style="list-style:none;display:flex;gap:10px;align-items:center;background:#fff;padding:10px;margin-bottom:8px;border-radius:10px";li.innerHTML=`<input type=checkbox ${x.checked?"checked":""}><span style="${x.checked?"text-decoration:line-through;color:#ccc":""}">${esc(x.name)} (${esc(x.amount)})</span><button style="margin-left:auto;color:red;background:none">×</button>`;li.querySelector("input").onchange=async()=>{x.checked=!x.checked;await put(S.shopping,x);renderShopping()};li.querySelector("button").onclick=async()=>{await del(S.shopping,x.id);shopping=shopping.filter(y=>y.id!=x.id);renderShopping()};$("shop").appendChild(li)})}
async function addManual(){let n=$("manual").value.trim();if(!n)return;await put(S.shopping,{id:id(),name:n,amount:$("amount").value.trim(),checked:false});$("manual").value=$("amount").value="";shopping=await all(S.shopping);renderShopping()}
async function renderStock(){ $("stock").innerHTML="";stock.forEach(x=>{let li=document.createElement("li");li.style="list-style:none;display:flex;justify-content:space-between;background:#fff;padding:10px;margin-bottom:5px;border-radius:8px";li.innerHTML=`<span>${esc(x.name)}</span><button style="color:red;background:none">×</button>`;li.querySelector("button").onclick=async()=>{await del(S.stock,x.id);stock=stock.filter(y=>y.id!=x.id);renderStock()};$("stock").appendChild(li)})}
async function addStock(){let n=$("stockInput").value.trim();if(!n)return;await put(S.stock,{id:id(),name:n});$("stockInput").value="";stock=await all(S.stock);renderStock()}
async function exportData(){let d={version:2,exportDate:new Date().toISOString(),recipes:(await all(S.recipes)).map(({imageBlob,...r})=>r),shopping:await all(S.shopping),stock:await all(S.stock),groups};let b=new Blob([JSON.stringify(d)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="my_kitchen_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();toast("書き出しました（画像除外）")}
async function importData(f){
  if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    const rs=Array.isArray(d)?d:(Array.isArray(d.recipes)?d.recipes:[]);
    if(!rs.length)throw new Error("レシピデータがありません");
    if(!confirm("バックアップのレシピ・買い物リスト・在庫を復元します。現在のデータは置き換わります。"))return;

    // Clear current data first, then restore the complete old-format structure.
    await clear(S.recipes);
    await clear(S.shopping);
    await clear(S.stock);

    const now=Date.now();
    for(const src of rs){
      const r={
        id:src.id||id(),
        title:src.title||"",
        group:src.group||"未分類",
        sourceUrl:src.sourceUrl||"",
        ingredients:Array.isArray(src.ingredients)?src.ingredients:[],
        steps:Array.isArray(src.steps)?src.steps:[],
        favorite:!!src.favorite,
        cookCount:Number(src.cookCount)||0,
        lastCookedDate:src.lastCookedDate||null,
        createdAt:src.createdAt||now,
        updatedAt:now,
        imageBlob:null
      };

      // Original backup stores images as data:image/...;base64,...
      // Convert them back to a binary Blob for IndexedDB.
      if(typeof src.image==="string" && src.image.startsWith("data:image/")){
        try{
          r.imageBlob=await (await fetch(src.image)).blob();
        }catch(imgErr){
          console.warn("画像の復元に失敗:",src.title,imgErr);
        }
      }else if(src.imageBlob instanceof Blob){
        r.imageBlob=src.imageBlob;
      }

      await put(S.recipes,r);
    }

    for(const x of (Array.isArray(d.shopping)?d.shopping:[])){
      await put(S.shopping,{
        id:x.id||id(),
        name:x.name||"",
        amount:x.amount||"",
        checked:!!x.checked
      });
    }

    for(const x of (Array.isArray(d.stock)?d.stock:[])){
      await put(S.stock,{
        id:x.id||id(),
        name:typeof x==="string"?x:(x.name||"")
      });
    }

    // Old backup uses groupOrder; the IndexedDB app uses settings.main.groups.
    groups=Array.isArray(d.groupOrder)?d.groupOrder:[];
    const recipeGroups=[...new Set(rs.map(r=>r.group||"未分類"))];
    for(const g of recipeGroups)if(!groups.includes(g))groups.push(g);
    await put(S.settings,{key:"main",groups});

    await load();
    alert("旧バックアップを完全復元しました。レシピ"+rs.length+"件・画像も復元しました。");
  }catch(e){
    console.error(e);
    alert("読み込みに失敗しました: "+(e.message||e));
  }
}

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
async function backupWithImages(){
  try{
    if(!window.JSZip) throw new Error("ZIPライブラリを読み込めませんでした");
    const db=await backupOpenDB();
    const recipes=await backupGetAll(db,"recipes");
    const shopping=await backupGetAll(db,"shopping");
    const stock=await backupGetAll(db,"stock");
    const groupSetting=await backupSetting(db,"main");
    const groupList=groupSetting?.groups || [];

    const zip=new JSZip();
    const meta=[];

    for(const r of recipes){
      const c={...r};
      const imageBlob=c.imageBlob;
      delete c.imageBlob;
      meta.push(c);

      if(imageBlob instanceof Blob){
        const ext=(imageBlob.type||"image/jpeg").split("/")[1]||"jpg";
        zip.file("images/"+r.id+"."+ext,imageBlob);
      }
    }

    zip.file("recipes.json",JSON.stringify(meta,null,2));
    zip.file("settings.json",JSON.stringify({
      groupOrder:groupList,
      shopping:shopping||[],
      stock:stock||[],
      formatVersion:3,
      exportedAt:new Date().toISOString()
    },null,2));

    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="my_kitchen_full_backup_"+new Date().toISOString().slice(0,10)+".zip";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    toast("画像を含む完全バックアップを作成しました");
  }catch(e){
    console.error(e);
    alert("画像付きバックアップに失敗しました: "+(e.message||e));
  }
}
function backupOpenDB(){
  return new Promise((res,rej)=>{
    const q=indexedDB.open("RecipeAppDB");
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  });
}
function backupGetAll(db,name){
  return new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains(name)) return res([]);
    const q=db.transaction(name,"readonly").objectStore(name).getAll();
    q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error);
  });
}
function backupSetting(db,key){
  return new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains("settings")) return res(null);
    const q=db.transaction("settings","readonly").objectStore("settings").get(key);
    q.onsuccess=()=>res(q.result ? (q.result.value??q.result) : null);
    q.onerror=()=>rej(q.error);
  });
}
function backupImage(db,id){
  return new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains("images")) return res(null);
    const q=db.transaction("images","readonly").objectStore("images").get(id);
    q.onsuccess=()=>{
      const v=q.result;
      res(v ? (v.blob||v.image||(v instanceof Blob?v:null)) : null);
    };
    q.onerror=()=>rej(q.error);
  });
}
async function restoreWithImages(file){
  try{
    if(!window.JSZip) throw new Error("ZIPライブラリを読み込めませんでした");
    const zip=await JSZip.loadAsync(file);
    const recipesEntry=zip.file("recipes.json");
    if(!recipesEntry)throw new Error("recipes.json がありません");

    const recipes=JSON.parse(await recipesEntry.async("string"));
    const settings=zip.file("settings.json")
      ?JSON.parse(await zip.file("settings.json").async("string"))
      :{};

    if(!Array.isArray(recipes)||!recipes.length)throw new Error("レシピデータがありません");
    if(!confirm("完全バックアップを復元します。現在のデータは置き換わります。"))return;

    const db=await backupOpenDB();
    await clearStoreBackup(db,"recipes");
    await clearStoreBackup(db,"shopping");
    await clearStoreBackup(db,"stock");

    for(const src of recipes){
      const r={...src,imageBlob:null};

      // Find the image regardless of jpg/jpeg/png extension.
      let entry=zip.file("images/"+src.id+".jpg")
        ||zip.file("images/"+src.id+".jpeg")
        ||zip.file("images/"+src.id+".png")
        ||zip.file("images/"+src.id+".webp");

      if(entry)r.imageBlob=await entry.async("blob");
      await backupPutOne(db,"recipes",r);
    }

    for(const x of (settings.shopping||[]))
      await backupPutOne(db,"shopping",{...x,id:x.id||id()});
    for(const x of (settings.stock||[]))
      await backupPutOne(db,"stock",{...x,id:x.id||id()});

    const gs=Array.isArray(settings.groupOrder)?settings.groupOrder:[];
    await backupPutSetting(db,"main",{groups:gs});

    await load();
    alert("完全バックアップを復元しました。レシピ"+recipes.length+"件・画像も復元しました。");
  }catch(e){
    console.error(e);
    alert("復元に失敗しました: "+(e.message||e));
  }
}
function clearStoreBackup(db,name){
  return new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains(name))return res();
    const t=db.transaction(name,"readwrite");
    t.objectStore(name).clear();
    t.oncomplete=res;
    t.onerror=()=>rej(t.error);
  });
}
function backupPutOne(db,name,item){
  return new Promise((res,rej)=>{
    const t=db.transaction(name,"readwrite");
    t.objectStore(name).put(item);
    t.oncomplete=res;
    t.onerror=()=>rej(t.error);
  });
}
function backupPutMany(db,name,items){
  return new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains(name)) return res();
    const t=db.transaction(name,"readwrite"),s=t.objectStore(name);
    items.forEach(x=>s.put(x)); t.oncomplete=res; t.onerror=()=>rej(t.error);
  });
}
function backupReplace(db,name,items){
  return new Promise((res,rej)=>{
    const t=db.transaction(name,"readwrite"),s=t.objectStore(name);
    s.clear(); items.forEach(x=>s.put(x)); t.oncomplete=res; t.onerror=()=>rej(t.error);
  });
}
function backupPutSetting(db,key,value){
  return new Promise((res,rej)=>{
    const t=db.transaction("settings","readwrite");
    t.objectStore("settings").put({key:key,value:value});
    t.oncomplete=res; t.onerror=()=>rej(t.error);
  });
}
function backupPutImage(db,id,blob){
  return new Promise((res,rej)=>{
    const t=db.transaction("images","readwrite");
    t.objectStore("images").put({id:id,blob:blob});
    t.oncomplete=res; t.onerror=()=>rej(t.error);
  });
}
</script>
